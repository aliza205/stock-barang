name: Build APK dari ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Memakai: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          # masuk ke folder yang berisi settings.gradle.kts
          PROJ=$(dirname "$(find src -name settings.gradle.kts | head -n 1)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stok-barang-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
